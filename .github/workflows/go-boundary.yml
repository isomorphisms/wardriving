name: Go acquisition boundary
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/autogenerated/go-acquisition-boundary
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Host protocol and cancellation experiments
        run: go test -v ./...
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
      - name: Loopback reuse comparison
        run: go test -run '^$' -bench BenchmarkTLSProbe -benchtime=100x -benchmem ./...
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
      - name: Explicit build-host Android NDK prerequisite
        run: go run ./cmd/qualify-native prepare-ndk
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
      - name: Host ABI, race detector and Android shared-library link
        run: go run ./cmd/qualify-native
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
